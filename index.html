<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Name the World</title>
<style>
:root{
  --sea:#C4D6DC;
  --paper:#EFEFE8;
  --panel:#F6F5EF;
  --land:#DAD7CC;
  --land-out:#E6E5DE;
  --ink:#22282B;
  --ink-2:#5C6266;
  --ink-3:#8A8F8E;
  --rule:#C3C2B7;
  --right:#2E6A50;
  --wrong:#A4382C;
  --shown:#8C8578;
  --live:#1F4E6B;
  --pad:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Helvetica Neue",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
.caps{
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:600;
}
.serif{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Hoefler Text","Times New Roman",serif;
}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}

header{
  display:flex;align-items:baseline;gap:16px;
  padding:10px var(--pad) 9px;
  border-bottom:1px solid var(--ink);
  flex:0 0 auto;
}
h1{
  margin:0;font-size:17px;font-weight:500;letter-spacing:.01em;
}
#tally{margin-left:auto;color:var(--ink-2);white-space:nowrap}
#gear{display:inline-block;background:none;border:1px solid var(--ink);padding:5px 9px;margin-left:10px}
#gear[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
#restart2{display:inline-block;background:none;border:1px solid var(--ink);padding:6px 10px}
#tally b{color:var(--ink);font-weight:600}

#bar{
  display:none;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px var(--pad);
  border-bottom:1px solid var(--rule);
  flex:0 0 auto;
}
body.setup #bar{display:flex}
#acts #restart{display:none}
.seg{display:flex;border:1px solid var(--ink);}
.seg button{
  background:none;border:0;padding:6px 10px;
  border-right:1px solid var(--ink);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.barlabel{color:var(--ink-3);margin-left:6px}

main{flex:1 1 auto;display:flex;min-height:0}

/* ---------- map ---------- */
#mapwrap{
  position:relative;flex:1 1 auto;min-width:0;
  background:var(--sea);
  overflow:hidden;
  touch-action:none;
}
svg#map{display:block;width:100%;height:100%;cursor:grab}
svg#map.dragging{cursor:grabbing}
path.c{fill:var(--land);stroke:#7C8079;stroke-width:.5;vector-effect:non-scaling-stroke}
path.c.play{cursor:pointer}
path.c.out{fill:var(--land-out);stroke:#A9ADA4;pointer-events:none}
path.c.done{fill:var(--tint,#C6D9B6)}
path.c.miss{fill:url(#hatch)}
path.c.told{fill:#CFCABC}
path.c.sel{stroke:var(--live);stroke-width:2.2}
path.c.hot{stroke:var(--ink);stroke-width:1.4}
circle.dot{fill:#B9B4A6;stroke:#6E7269;stroke-width:.5;cursor:pointer;vector-effect:non-scaling-stroke}
circle.dot.out{fill:#DEDCD3;stroke:#B2B6AD;pointer-events:none}
circle.dot.done{fill:var(--tint,#C6D9B6)}
circle.dot.miss{fill:var(--wrong)}
circle.dot.told{fill:var(--shown)}
circle.dot.sel{stroke:var(--live);stroke-width:2.2}
@media (prefers-reduced-motion:no-preference){
  path.c,circle.dot{transition:fill .25s ease}
  #scene.ease{transition:transform .38s cubic-bezier(.4,0,.2,1)}
}

#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
#zoom button{
  width:34px;height:34px;line-height:1;
  background:var(--panel);border:1px solid var(--ink);
  font-size:16px;
}
#hint{
  position:absolute;left:10px;bottom:10px;right:56px;
  color:var(--ink-2);pointer-events:none;
  font-size:12px;
}

/* ---------- gazetteer ---------- */
#panel{
  flex:0 0 300px;display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border-left:1px solid var(--ink);
}
#prompt{padding:12px var(--pad) 10px;border-bottom:1px solid var(--rule);flex:0 0 auto}
#promptlabel{color:var(--ink-3);display:block;margin-bottom:3px}
#promptname{font-size:19px;line-height:1.25}
#promptname.idle{color:var(--ink-3);font-size:15px}
#verdict{margin-top:7px;font-size:13.5px;line-height:1.4;display:none}
#verdict.on{display:block}
#verdict .ok{color:var(--right)}
#verdict .no{color:var(--wrong)}
#verdict .tell{color:var(--shown)}

#findwrap{padding:9px var(--pad);border-bottom:1px solid var(--rule);flex:0 0 auto;display:flex;gap:8px}
#find{
  flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--ink);
  padding:5px 2px;font:inherit;color:inherit;border-radius:0;
}
#find:focus{outline:0;border-bottom-width:2px;margin-bottom:-1px}
#find::placeholder{color:var(--ink-3)}

#index{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px}
#index .row{
  display:flex;align-items:baseline;width:100%;
  background:none;border:0;text-align:left;
  padding:7px var(--pad);line-height:1.2;
}
#index .row:hover{background:#E6E4DA}
#index .row:focus-visible{outline:2px solid var(--live);outline-offset:-2px}
#index .row .lead{
  flex:1 1 auto;border-bottom:1px dotted var(--rule);
  margin:0 6px;transform:translateY(-4px);min-width:12px;
}
#index .row .mark{color:var(--ink-3);font-size:11px;letter-spacing:.1em}
#index .row.used{color:var(--ink-3);cursor:default}
#index .row.used:hover{background:none}
#index .row.cursor{background:#E2E5DC}
#index .none{padding:14px var(--pad);color:var(--ink-3)}
#index .grp{
  padding:12px var(--pad) 4px;color:var(--ink-3);
  position:sticky;top:0;background:var(--panel);
}

#acts{
  flex:0 0 auto;border-top:1px solid var(--ink);
  padding:9px var(--pad);display:flex;gap:8px;flex-wrap:wrap;
}
#acts button{
  background:none;border:1px solid var(--ink);padding:7px 11px;
}
#acts button:disabled{border-color:var(--rule);color:var(--ink-3);cursor:default}
#acts button.key{background:var(--ink);color:var(--paper)}
#acts button.key:disabled{background:var(--rule);border-color:var(--rule);color:var(--panel)}

/* ---------- results ---------- */
#sheet{
  position:fixed;inset:0;background:rgba(34,40,43,.45);
  display:none;align-items:center;justify-content:center;padding:18px;z-index:20;
}
#sheet.on{display:flex}
#sheetbox{
  background:var(--panel);border:1px solid var(--ink);
  max-width:420px;width:100%;max-height:80vh;display:flex;flex-direction:column;
}
#sheethead{padding:16px var(--pad) 12px;border-bottom:1px solid var(--ink)}
#score{font-size:30px;line-height:1;margin:6px 0 0}
#score small{font-size:15px;color:var(--ink-2)}
#sheetlist{overflow-y:auto;padding:6px 0}
#sheetlist .r{display:flex;align-items:baseline;padding:6px var(--pad);gap:8px}
#sheetlist .r .was{color:var(--wrong);font-size:13px}
#sheetfoot{padding:11px var(--pad);border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap}
#sheetfoot button{background:none;border:1px solid var(--ink);padding:7px 11px}
#sheetfoot button.key{background:var(--ink);color:var(--paper)}

/* ---------- mobile ---------- */
@media (max-width:760px){
  :root{--pad:12px}
  main{flex-direction:column}
  #mapwrap{flex:1 1 auto;min-height:32vh}
  #panel{flex:0 0 auto;max-height:50vh;border-left:0;border-top:1px solid var(--ink);min-height:0}
  #index{min-height:70px}

  header{padding:7px var(--pad) 6px}
  h1{font-size:14px}
  #bar{gap:5px;padding:8px var(--pad)}
  .seg button{padding:8px 9px}
  .barlabel{margin-left:2px;width:100%}

  /* the prompt sits on one line */
  #prompt{padding:9px var(--pad) 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
  #promptlabel{margin:0}
  #promptname{font-size:17px}
  #verdict{width:100%;margin-top:5px;font-size:13px}
  #findwrap{padding:7px var(--pad)}
  #acts{padding:7px var(--pad)}
  #acts button{padding:8px 10px}
  #hint{display:none}
  #index .row{padding:9px var(--pad)}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="serif">Name the World</h1>
    <div id="tally" class="caps"></div>
    <button id="gear" class="caps" aria-expanded="false" aria-controls="bar">Setup</button>
  </header>

  <div id="bar">
    <div class="seg" id="modeseg" role="group" aria-label="Game">
      <button data-mode="world" class="caps">World</button>
      <button data-mode="continent" class="caps">By continent</button>
      <button data-mode="continents" class="caps">Continents</button>
    </div>
    <div class="seg" id="contseg" role="group" aria-label="Continent"></div>
    <span class="barlabel caps">List</span>
    <div class="seg" id="listseg" role="group" aria-label="Country list">
      <button data-list="1" class="caps">On</button>
      <button data-list="0" class="caps">Off</button>
    </div>
    <span class="barlabel caps">Check</span>
    <div class="seg" id="checkseg" role="group" aria-label="When to check">
      <button data-check="end" class="caps">At the end</button>
      <button data-check="auto" class="caps">As you go</button>
    </div>
    <button id="restart2" class="caps">Restart</button>
  </div>

  <main>
    <div id="mapwrap">
      <svg id="map" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid meet" aria-label="World map">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="#E8D2CE"/>
            <line x1="0" y1="0" x2="0" y2="6" stroke="#A4382C" stroke-width="2"/>
          </pattern>
        </defs>
        <g id="scene"></g>
      </svg>
      <div id="hint" class="caps"></div>
      <div id="zoom">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit" aria-label="Fit map" style="font-size:12px">Fit</button>
      </div>
    </div>

    <div id="panel">
      <div id="prompt">
        <span id="promptlabel" class="caps">Selected</span>
        <div id="promptname" class="serif idle">Tap a country on the map</div>
        <div id="verdict"></div>
      </div>
      <div id="findwrap">
        <input id="find" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type to filter…" aria-label="Filter country names">
      </div>
      <div id="index" role="listbox" aria-label="Country index"></div>
      <div id="acts">
        <button id="check" class="key caps">Check answers</button>
        <button id="skip" class="caps">Next unnamed</button>
        <button id="restart" class="caps">Restart</button>
      </div>
    </div>
  </main>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="scoretitle">
  <div id="sheetbox">
    <div id="sheethead">
      <span class="caps" id="scoretitle">Result</span>
      <p id="score" class="serif"></p>
    </div>
    <div id="sheetlist"></div>
    <div id="sheetfoot">
      <button id="retry" class="key caps">Try the misses again</button>
      <button id="revealall" class="caps">Show all answers</button>
      <button id="close" class="caps">Close</button>
    </div>
  </div>
</div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const CONTINENTS = ['Africa','Asia','Europe','North America','South America','Oceania','Antarctica'];
const HUE = {
  'Africa':['#E0C79B','#D7BC8C','#EBD8B4'],
  'Asia':['#D7BDBE','#E6D2D1','#C7ABAD'],
  'Europe':['#BCCBAE','#CFDBC2','#A9BB9A'],
  'North America':['#B7C9D4','#CBD9E1','#A3B9C6'],
  'South America':['#DBC49C','#E8D8BB','#C9B189'],
  'Oceania':['#C6BCD1','#D8D1E0','#B4A8C3'],
  'Antarctica':['#E6EEF1','#E6EEF1','#E6EEF1']
};
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ').replace(/\bthe\b/g,' ')
  .replace(/\s+/g,' ').trim();
const collator = new Intl.Collator('en-GB');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++)d[i]=[i];
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

/* ============ saved progress ============ */
/* localStorage where it is available; a no-op object where it is blocked */
const KEY = 'name-the-world/v1';
const store = (()=>{
  try{
    const t = '__t';
    window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t);
    return window.localStorage;
  }catch(e){ return null; }
})();
let saveTimer = 0;
function save(){
  if(!store) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      store.setItem(KEY, JSON.stringify({
        v:1, ans:S.ans, mode:S.mode, continent:S.continent,
        list:S.list, check:S.check, checked:S.checked
      }));
    }catch(e){ /* quota or private mode - carry on unsaved */ }
  }, 250);
}
function restore(){
  if(!store) return false;
  let o;
  try{ o = JSON.parse(store.getItem(KEY) || 'null'); }catch(e){ return false; }
  if(!o || o.v !== 1) return false;
  const ans = {};
  for(const [code,a] of Object.entries(o.ans || {})){
    if(BY_CODE[code] && a && typeof a.given === 'string') ans[code] = a;
  }
  S.ans = ans;
  if(['world','continent','continents'].includes(o.mode)) S.mode = o.mode;
  if(CONTINENTS.includes(o.continent)) S.continent = o.continent;
  if(typeof o.list === 'boolean') S.list = o.list;
  if(o.check === 'end' || o.check === 'auto') S.check = o.check;
  S.checked = !!o.checked;
  return Object.keys(ans).length > 0;
}
function forget(){ try{ store && store.removeItem(KEY); }catch(e){} }

/* ============ model ============ */
DATA.forEach((e,i)=>{
  e.key = norm(e.name);
  e.keys = [...new Set([e.key, ...(e.aliases||[]).map(norm)])].filter(Boolean);
  const fam = HUE[e.continent] || HUE.Europe;
  e.tint = fam[(e.code.charCodeAt(0)+e.code.charCodeAt(2)+i)%fam.length];
});
const BY_CODE = Object.fromEntries(DATA.map(e=>[e.code,e]));
const PLAYABLE = DATA.filter(e=>e.play);
const CONT_ENTRY = CONTINENTS.map(name=>{
  const parts = DATA.filter(e=>e.continent===name && (e.mb || e.b));
  const b = parts.reduce((a,e)=>{ const q = e.mb || e.b;
    return [Math.min(a[0],q[0]),Math.min(a[1],q[1]),Math.max(a[2],q[2]),Math.max(a[3],q[3])]; },[9e9,9e9,-9e9,-9e9]);
  const al = name==='Oceania' ? ['Australasia','Australia and Oceania'] : [];
  const e = {code:'CONT-'+name, name, continent:name, isCont:true, b, mb:b, tint:HUE[name][0], aliases:al};
  e.key = norm(name); e.keys = [e.key, ...al.map(norm)];
  return e;
});
CONT_ENTRY.forEach(c=>{ BY_CODE[c.code]=c; });

const S = {
  mode:'world', continent:'Europe', list:true, check:'end',
  ans:{}, sel:null, checked:false, cursor:0
};

function targets(){
  if(S.mode==='continents') return CONT_ENTRY;
  if(S.mode==='continent') return PLAYABLE.filter(e=>e.continent===S.continent);
  return PLAYABLE;
}
function options(){ return targets().slice().sort((a,b)=>collator.compare(a.name,b.name)); }
function entryForShape(e){
  if(S.mode==='continents') return e.continent ? BY_CODE['CONT-'+e.continent] : null;
  return targets().includes(e) ? e : null;
}
/* an answer is judged (its truth shown) in auto mode, after a check, or once revealed */
function judged(code){
  const a = S.ans[code];
  return !!a && (S.check==='auto' || S.checked || a.told);
}
function unnamed(){ return targets().filter(e=>!S.ans[e.code]); }
/* a name is spent (can't be used again) while it stands as an answer */
function spentNames(){
  const out = new Set();
  for(const [code,a] of Object.entries(S.ans)){
    if(a.told) continue;
    if(a.ok || !judged(code)) out.add(a.given);
  }
  return out;
}

/* ============ map ============ */
const scene = $('#scene'), svg = $('#map');
let k=1, tx=0, ty=0;
const nodes = {};

function buildMap(){
  const frag = document.createDocumentFragment();
  DATA.filter(e=>e.d).forEach(e=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', e.d); p.setAttribute('class','c'); p.dataset.code = e.code;
    frag.appendChild(p); (nodes[e.code] = nodes[e.code]||[]).push(p);
  });
  /* click targets for anything too small to hit at map scale */
  DATA.filter(e=>e.point || (e.play && e.px < 30)).forEach(e=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',e.c[0]); c.setAttribute('cy',e.c[1]); c.setAttribute('r',4);
    c.setAttribute('class','dot'); c.dataset.code = e.code;
    frag.appendChild(c); (nodes[e.code] = nodes[e.code]||[]).push(c);
  });
  scene.appendChild(frag);
}

function paintMap(){
  const live = new Set(targets().map(e=>e.code));
  for(const e of DATA){
    const els = nodes[e.code]; if(!els) continue;
    const t = S.mode==='continents' ? (e.continent ? BY_CODE['CONT-'+e.continent] : null)
                                    : (live.has(e.code) ? e : null);
    const a = t ? S.ans[t.code] : null;
    const seen = t && judged(t.code);
    let cls = t ? ' play' : ' out';
    if(a){
      if(seen && a.told) cls += ' told';
      else if(seen && !a.ok) cls += ' miss';
      else cls += ' done';
    }
    if(t && S.sel===t.code) cls += ' sel';
    for(const el of els){
      el.setAttribute('class', (el.tagName==='circle'?'dot':'c') + cls);
      if(a && (!seen || a.ok)) el.style.setProperty('--tint', t.tint);
      else el.style.removeProperty('--tint');
    }
  }
  sizeDots();
}
function sizeDots(){
  const r = Math.max(1.8, 4/k);
  scene.querySelectorAll('circle').forEach(c=>c.setAttribute('r', r));
}

/* --- view transform --- */
function applyView(){
  scene.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${k.toFixed(4)})`);
  sizeDots();
}
const OVER_X = 500, OVER_Y = 250;
function clampView(){
  tx = Math.min(OVER_X, Math.max(2000*(1-k) - OVER_X, tx));
  ty = Math.min(OVER_Y, Math.max(1000*(1-k) - OVER_Y, ty));
}
/* client coords -> viewBox coords, exact under preserveAspectRatio */
function toView(cx, cy){
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  const m = svg.getScreenCTM();
  return m ? pt.matrixTransform(m.inverse()) : {x:0,y:0};
}
function zoomAt(clientX, clientY, factor){
  const nk = Math.min(16, Math.max(1, k*factor));
  if(nk === k) return;
  const v = toView(clientX, clientY);
  tx = v.x - (v.x - tx) * (nk/k);
  ty = v.y - (v.y - ty) * (nk/k);
  k = nk; clampView(); applyView();
}
function fitTo(b, pad){
  if(!b || b[0] > b[2]){ k=1; tx=0; ty=0; applyView(); return; }
  pad = pad == null ? 50 : pad;
  const w = (b[2]-b[0]) + pad*2, h = (b[3]-b[1]) + pad*2;
  k = Math.min(16, Math.max(1, Math.min(2000/w, 1000/h)));
  tx = 1000 - ((b[0]+b[2])/2) * k;
  ty = 500  - ((b[1]+b[3])/2) * k;
  clampView(); applyView();
}
function fitCurrent(){
  if(S.mode === 'continent'){
    const b = targets().filter(e=>e.b).reduce((a,e)=>[Math.min(a[0],e.b[0]),Math.min(a[1],e.b[1]),Math.max(a[2],e.b[2]),Math.max(a[3],e.b[3])],[9e9,9e9,-9e9,-9e9]);
    fitTo(b);
  } else { k=1; tx=0; ty=0; applyView(); }
}
let easeTimer = 0;
function ease(){
  scene.classList.add('ease');
  clearTimeout(easeTimer);
  easeTimer = setTimeout(()=>scene.classList.remove('ease'), 420);
}
/* centre the selected place and zoom so it fills about half the frame */
function frameOn(t){
  const b = t.mb || t.b;
  if(!b || b[0] > b[2]) return;
  const w = b[2]-b[0], h = b[3]-b[1];
  if(w > 900 || h > 500){          // spans too much of the globe to frame usefully
    k = 1; tx = 0; ty = 0; ease(); applyView(); return;
  }
  k = Math.max(1, Math.min(14, Math.min(1000/Math.max(w,8), 500/Math.max(h,8))));
  tx = 1000 - ((b[0]+b[2])/2) * k;
  ty = 500  - ((b[1]+b[3])/2) * k;
  clampView(); ease(); applyView();
}

/* --- pointer: drag to pan, tap to select, wheel/pinch to zoom --- */
let drag = null, moved = false;
const pointers = new Map();
let pinchDist = 0;

svg.addEventListener('pointerdown', ev=>{
  pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
    drag = null; return;
  }
  scene.classList.remove('ease');
  const v = toView(ev.clientX, ev.clientY);
  drag = {vx:v.x, vy:v.y, tx, ty};
  moved = false;
  svg.setPointerCapture(ev.pointerId);
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', ev=>{
  if(pointers.has(ev.pointerId)) pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchDist > 0 && d > 0) zoomAt((a.x+b.x)/2, (a.y+b.y)/2, d/pinchDist);
    pinchDist = d; moved = true; return;
  }
  if(!drag) return;
  const v = toView(ev.clientX, ev.clientY);
  const dx = v.x - drag.vx, dy = v.y - drag.vy;
  if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
  tx = drag.tx + dx; ty = drag.ty + dy;
  clampView(); applyView();
});
function endPointer(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size < 2) pinchDist = 0;
  drag = null; svg.classList.remove('dragging');
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('wheel', ev=>{
  ev.preventDefault();
  zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.15 : 1/1.15);
}, {passive:false});
svg.addEventListener('click', ev=>{
  if(moved) return;
  const el = ev.target.closest('[data-code]'); if(!el) return;
  const shape = BY_CODE[el.dataset.code]; if(!shape) return;
  const t = entryForShape(shape); if(!t) return;
  select(t.code);
});
$('#zin').onclick = ()=>{ const r = svg.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1.5); };
$('#zout').onclick = ()=>{ const r = svg.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.5); };
$('#zfit').onclick = fitCurrent;

/* ============ panel ============ */
function setVerdict(html, cls){ const v = $('#verdict'); v.innerHTML = html; v.className = 'on ' + (cls||''); }
function clearVerdict(){ const v = $('#verdict'); v.className = ''; v.innerHTML = ''; }
function verdictFor(t){
  const a = S.ans[t.code];
  if(!a){ clearVerdict(); return; }
  if(!judged(t.code)){ setVerdict(`Named <b>${esc(a.given)}</b>. Tap it again to change it.`); return; }
  if(a.told) setVerdict(`<span class="tell">Answer:</span> <b>${esc(t.name)}</b>`);
  else if(a.ok) setVerdict(`<span class="ok">Correct.</span> ${esc(t.name)}`);
  else setVerdict(`<span class="no">Not ${esc(a.given)}.</span> Have another go, or <button id="tellme">show the answer</button>.`);
}
$('#verdict').addEventListener('click', ev=>{
  if(ev.target.id === 'tellme' && S.sel) reveal(S.sel);
});

function select(code){
  S.sel = code; S.cursor = 0;
  $('#find').value = '';
  const t = BY_CODE[code];
  verdictFor(t);
  render();
  frameOn(t);
  if(window.matchMedia && window.matchMedia('(min-width:761px)').matches) $('#find').focus();
}

function renderPrompt(){
  const nm = $('#promptname'), lb = $('#promptlabel');
  const t = S.sel && BY_CODE[S.sel];
  if(!t){
    nm.className = 'serif idle';
    nm.textContent = S.mode==='continents' ? 'Tap a continent on the map' : 'Tap a country on the map';
    lb.textContent = 'Selected'; return;
  }
  const a = S.ans[S.sel];
  nm.className = 'serif';
  if(a && judged(S.sel) && (a.ok || a.told)){ lb.textContent = 'Named'; nm.textContent = t.name; }
  else if(a){ lb.textContent = 'Your answer'; nm.textContent = a.given; }
  else { lb.textContent = S.mode==='continents' ? 'Name this continent' : 'Name this one'; nm.textContent = '—'; }
}

function renderIndex(){
  const box = $('#index');
  box.innerHTML = '';
  if(!S.list){
    box.innerHTML = '<p class="none">List off. Type the name and press return — near-misses and old names count.</p>';
    return;
  }
  const q = norm($('#find').value);
  const spent = spentNames();
  let list = options();
  if(q) list = list.filter(e => e.keys.some(kk => kk.includes(q)));
  if(!list.length){ box.innerHTML = '<p class="none">No name matches that.</p>'; return; }
  const frag = document.createDocumentFragment();
  let cursorIdx = 0;
  list.forEach(e=>{
    const used = spent.has(e.name);
    const b = document.createElement('button');
    b.type = 'button';
    const isCursor = !used && cursorIdx++ === S.cursor;
    b.className = 'row' + (used ? ' used' : '') + (isCursor ? ' cursor' : '');
    const a = S.ans[e.code];
    let mark = '';
    if(a && judged(e.code)) mark = a.told ? 'shown' : (a.ok ? '✓' : '');
    else if(used) mark = 'used';
    b.innerHTML = `<span>${esc(e.name)}</span><span class="lead"></span><span class="mark caps">${mark}</span>`;
    if(!used) b.onclick = ()=> answer(e.name);
    frag.appendChild(b);
  });
  box.appendChild(frag);
}

function renderBar(){
  document.querySelectorAll('#modeseg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===S.mode)));
  document.querySelectorAll('#listseg button').forEach(b=>b.setAttribute('aria-pressed', String((b.dataset.list==='1')===S.list)));
  document.querySelectorAll('#checkseg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.check===S.check)));
  const cs = $('#contseg');
  cs.style.display = S.mode==='continent' ? 'flex' : 'none';
  cs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.cont===S.continent)));
  $('#find').placeholder = S.list ? 'Type to filter…' : 'Type the name, then return';
}

function renderTally(){
  const t = targets();
  const named = t.filter(e=>S.ans[e.code]).length;
  const right = t.filter(e=>S.ans[e.code] && S.ans[e.code].ok && judged(e.code)).length;
  const tight = window.innerWidth <= 760;
  $('#tally').innerHTML = (S.check==='auto' || S.checked)
    ? (tight ? `<b>${right}</b>✓ · ${named}/${t.length}` : `<b>${right}</b> right · <b>${named}</b> of ${t.length} done`)
    : (tight ? `<b>${named}</b>/${t.length}` : `<b>${named}</b> of <b>${t.length}</b> named`);
  const all = named === t.length;
  const btn = $('#check');
  btn.disabled = S.check==='auto' || !all;
  btn.textContent = S.check==='auto' ? (tight ? 'Auto' : 'Checking as you go')
                  : (all ? 'Check answers' : (tight ? `${t.length-named} to go` : `${t.length-named} still to name`));
  $('#skip').textContent = unnamed().length ? (tight ? 'Next' : 'Next unnamed') : 'All named';
  $('#skip').disabled = !unnamed().length;
}

function render(){ renderBar(); renderPrompt(); renderIndex(); renderTally(); paintMap(); save(); }

/* ============ answering ============ */
function match(text){
  const q = norm(text); if(!q) return null;
  const pool = targets();
  const exact = pool.find(e=>e.keys.includes(q));
  if(exact) return exact;
  const starts = pool.filter(e=>e.keys.some(kk=>kk.startsWith(q)));
  if(starts.length === 1) return starts[0];
  const near = pool.map(e=>({e, d:Math.min(...e.keys.map(kk=>lev(q,kk)))}))
                   .filter(x=>x.d <= (q.length > 7 ? 2 : 1))
                   .sort((a,b)=>a.d-b.d);
  if(near.length && (near.length === 1 || near[0].d < near[1].d)) return near[0].e;
  return null;
}

function answer(text){
  if(!S.sel){ setVerdict('Tap a country on the map first.'); return; }
  const t = BY_CODE[S.sel];
  const guess = match(text);
  if(!guess && !S.list){
    setVerdict(`Nothing here is called <b>${esc(text.trim())}</b> — check the spelling.`);
    return;
  }
  const name = guess ? guess.name : text.trim();
  if(!guess) return;
  S.ans[t.code] = {given:name, ok: guess.code === t.code, told:false};
  $('#find').value = ''; S.cursor = 0;

  if(S.check === 'auto' && !S.ans[t.code].ok){
    render(); verdictFor(t);
  } else {
    render();
    advance();
  }
}

function advance(){
  const rest = unnamed();
  if(!rest.length){
    if(S.check === 'auto'){ S.sel = null; render(); openSheet(); }
    else { S.sel = null; render(); setVerdict('Everything is named. Check your answers when you are ready.'); }
    return;
  }
  const from = S.sel ? BY_CODE[S.sel] : null;
  let pick = rest[0];
  if(from && from.c){
    let best = Infinity;
    for(const e of rest){
      if(!e.c) continue;
      const d = Math.hypot(e.c[0]-from.c[0], e.c[1]-from.c[1]);
      if(d < best){ best = d; pick = e; }
    }
  }
  select(pick.code);
}

function reveal(code){
  const t = BY_CODE[code];
  S.ans[code] = {given:t.name, ok:false, told:true};
  render(); verdictFor(t);
}
function checkAll(){ S.checked = true; S.sel = null; render(); openSheet(); }

/* ============ results ============ */
function openSheet(){
  const t = targets();
  const right = t.filter(e=>S.ans[e.code] && S.ans[e.code].ok).length;
  const misses = t.filter(e=>!S.ans[e.code] || !S.ans[e.code].ok);
  $('#score').innerHTML = `${right} of ${t.length} <small>named correctly</small>`;
  const list = $('#sheetlist');
  list.innerHTML = '';
  if(!misses.length){
    list.innerHTML = '<p style="padding:16px;color:var(--ink-2)" class="serif">A clean sheet — every one right.</p>';
  } else {
    misses.forEach(e=>{
      const a = S.ans[e.code];
      const r = document.createElement('div'); r.className = 'r';
      r.innerHTML = `<span>${esc(e.name)}</span><span class="lead" style="flex:1;border-bottom:1px dotted var(--rule);margin:0 6px;transform:translateY(-4px)"></span>` +
        `<span class="was">${a && !a.told ? 'you said ' + esc(a.given) : (a && a.told ? 'shown' : 'not named')}</span>`;
      list.appendChild(r);
    });
  }
  $('#retry').style.display = misses.length ? '' : 'none';
  $('#sheet').classList.add('on');
}
$('#close').onclick = ()=> $('#sheet').classList.remove('on');
$('#revealall').onclick = ()=>{
  targets().forEach(e=>{ if(!S.ans[e.code] || !S.ans[e.code].ok) S.ans[e.code] = {given:e.name, ok:false, told:true}; });
  S.checked = true; $('#sheet').classList.remove('on'); render();
};
$('#retry').onclick = ()=>{
  targets().forEach(e=>{ const a = S.ans[e.code]; if(a && !a.ok) delete S.ans[e.code]; });
  S.checked = false; S.sel = null;
  $('#sheet').classList.remove('on');
  render(); advance();
};

/* ============ controls ============ */
document.querySelectorAll('#modeseg button').forEach(b=>b.onclick = ()=>{ S.mode = b.dataset.mode; switchView(); });
document.querySelectorAll('#listseg button').forEach(b=>b.onclick = ()=>{ S.list = b.dataset.list === '1'; render(); });
document.querySelectorAll('#checkseg button').forEach(b=>b.onclick = ()=>{
  S.check = b.dataset.check;
  if(S.check === 'auto') S.checked = false;
  render();
  if(S.sel) verdictFor(BY_CODE[S.sel]);
});
CONTINENTS.filter(c=>c!=='Antarctica').forEach(c=>{
  const b = document.createElement('button');
  b.className = 'caps'; b.dataset.cont = c;
  b.textContent = c.replace('North America','N. America').replace('South America','S. America');
  b.onclick = ()=>{ S.continent = c; switchView(); };
  $('#contseg').appendChild(b);
});
$('#gear').onclick = ()=>{
  const open = document.body.classList.toggle('setup');
  $('#gear').setAttribute('aria-expanded', String(open));
};
/* choosing a setting on mobile closes the drawer again */
document.querySelectorAll('#bar .seg button').forEach(b=>b.addEventListener('click', ()=>{
  document.body.classList.remove('setup'); $('#gear').setAttribute('aria-expanded','false');
}));
$('#restart2').onclick = ()=>{ reset(); document.body.classList.remove('setup'); $('#gear').setAttribute('aria-expanded','false'); };
window.addEventListener('resize', ()=>{ renderTally(); });
$('#check').onclick = checkAll;
$('#skip').onclick = advance;
$('#restart').onclick = reset;

/* changing game keeps what you have already named - only the view and checking reset */
function switchView(){
  S.sel = null; S.checked = false; S.cursor = 0;
  $('#find').value = ''; clearVerdict();
  $('#sheet').classList.remove('on');
  render(); fitCurrent();
}
function reset(){
  forget();
  S.ans = {}; S.sel = null; S.checked = false; S.cursor = 0;
  $('#find').value = ''; clearVerdict();
  $('#sheet').classList.remove('on');
  render(); fitCurrent();
}

$('#find').addEventListener('input', ()=>{ S.cursor = 0; renderIndex(); });
$('#find').addEventListener('keydown', ev=>{
  if(ev.key === 'Enter'){
    ev.preventDefault();
    if(!S.list){ answer($('#find').value); return; }
    const rows = [...$('#index').querySelectorAll('.row:not(.used)')];
    const el = rows[S.cursor] || rows[0];
    if(el) el.click();
    else answer($('#find').value);   /* nothing filtered - fall back to near-miss matching */
    return;
  }
  if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
    ev.preventDefault();
    const n = $('#index').querySelectorAll('.row:not(.used)').length;
    S.cursor = Math.max(0, Math.min(n-1, S.cursor + (ev.key === 'ArrowDown' ? 1 : -1)));
    renderIndex();
    const el = $('#index').querySelector('.cursor');
    if(el) el.scrollIntoView({block:'nearest'});
    return;
  }
  if(ev.key === 'Escape'){ $('#find').value = ''; S.cursor = 0; renderIndex(); }
});

/* ============ go ============ */
buildMap();
const resumed = restore();
render();
fitCurrent();
if(resumed){
  const done = targets().filter(e=>S.ans[e.code]).length;
  if(done) setVerdict(`Picked up where you left off — <b>${done}</b> named. Restart is under Setup.`);
}
window.addEventListener('pagehide', ()=>{ clearTimeout(saveTimer); try{ store && store.setItem(KEY, JSON.stringify({v:1,ans:S.ans,mode:S.mode,continent:S.continent,list:S.list,check:S.check,checked:S.checked})); }catch(e){} });

</script>
