<!DOCTYPE html>
<html lang="en-GB">
<meta charset="utf-8">
<title>Shape Pit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Shapes fall, pile up and fill the screen. Guess how many.">
<style>
/* light is the plain state; dark is redefined twice, once for a system that
   asks for it and once for a viewer that has said so outright */
:root{
  color-scheme:light;
  --ink:#ECE5DB; --floor:#E1D8C9; --panel:#FBF8F1; --edge:#DAD3C4;
  --dim:#6E6A5F; --text:#22262A; --hi:#9A6B1F; --shade:rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#12171A; --floor:#0C1013; --panel:#1B2226; --edge:#2C363B;
    --dim:#7E8D94; --text:#DCE4E7; --hi:#E4B363; --shade:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#12171A; --floor:#0C1013; --panel:#1B2226; --edge:#2C363B;
  --dim:#7E8D94; --text:#DCE4E7; --hi:#E4B363; --shade:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; background:var(--ink); color:var(--text);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none; user-select:none;
}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Hoefler Text",Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}

/* the heads-up layer sits over the pit and lets clicks through except on its own controls */
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));gap:14px}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hud > *{pointer-events:none}
.hud button,.hud input,.hud form{pointer-events:auto}

.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em}
.status{margin:0;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.brand h1,.status{text-shadow:0 1px 0 var(--ink),0 0 12px var(--ink)}

.centre{flex:1;display:flex;align-items:center;justify-content:center}
/* the controls live up in the empty air above the pile, where they cover
   nothing anyone has to count */
.dock{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-left:auto}

.card{
  pointer-events:auto;background:var(--panel);
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--edge);border-radius:12px;padding:18px 20px;
  box-shadow:0 10px 34px var(--shade);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  max-width:min(420px,calc(100vw - 36px));text-align:center;
}
.card h2{margin:0 0 8px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.card p{margin:0 0 14px;color:var(--dim);text-wrap:pretty}
.card p:last-of-type{margin-bottom:14px}

.row{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;flex-wrap:wrap;justify-content:center}
.row label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
input[type=number]{
  font:inherit;font-size:20px;font-variant-numeric:tabular-nums;width:5.5ch;
  color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--edge);
  padding:2px 4px;text-align:center;-moz-appearance:textfield;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

button{font:inherit;font-size:13px;color:var(--text);background:transparent;
  border:1px solid var(--edge);border-radius:7px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--hi);border-color:var(--hi);color:var(--panel);font-weight:500}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;color:var(--dim);font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;background:color-mix(in srgb,var(--ink) 60%,transparent)}
button.ghost:hover{color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:3px}

.verdict{margin:0 0 6px!important;font-size:24px;color:var(--text)!important;letter-spacing:-.01em}
.detail{margin:0 0 4px!important}
.detail b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.best{margin:0 0 14px!important;font-size:12px;color:var(--dim)!important;
  font-variant-numeric:tabular-nums;min-height:1.2em}
</style>

<canvas id="pit"></canvas>

<div class="hud">
  <div class="bar">
    <header class="brand">
      <h1 class="serif">Shape Pit</h1>
      <p class="status" id="status">a guessing game</p>
    </header>

    <div class="dock">
      <button class="ghost" id="skipBtn" hidden>Settle them now</button>

      <form class="card row" id="guessCard" hidden autocomplete="off">
        <label for="guessInput">How many?</label>
        <input id="guessInput" type="number" min="1" max="99999" step="1" inputmode="numeric" placeholder="?">
        <button class="primary" type="submit">Guess</button>
      </form>

      <div class="card" id="resultCard" hidden aria-live="polite">
        <p class="verdict serif" id="verdict"></p>
        <p class="detail" id="detail"></p>
        <p class="best" id="best"></p>
        <button class="primary" id="againBtn">Again</button>
      </div>
    </div>
  </div>

  <div class="centre">
    <div class="card" id="startCard">
      <h2 class="serif">How many pieces?</h2>
      <p>Pieces rain down and pile up until the pit is full. Once they have all come
         to rest, say how many there are. Every round is cut afresh &mdash; new
         shapes, new sizes, new colours.</p>
      <button class="primary" id="dropBtn">Drop them in</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- colour */
/* a palette is four colours off one hue wheel, each given its own lightness so
   no two pieces ever sit at the same value — and now and then, a set taken from
   somewhere real instead */
const ROOMS = [
  [[232,99,104],[240,211,133],[60,97,142],[173,172,45]],    /* a blue room with a coral ceiling */
  [[201,93,74],[233,196,140],[58,88,84],[139,155,120]],     /* terracotta and verdigris */
  [[86,110,150],[222,180,90],[173,88,96],[126,148,131]]     /* a wet afternoon */
];
const WHEELS = [[0,28,56,84], [0,120,240,40], [0,150,205,32], [0,66,186,246]];

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp = (v,lo,hi) => v < lo ? lo : v > hi ? hi : v;

function hsl(h, s, l){                       /* h 0-360, s and l 0-100 */
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s*Math.min(l, 1-l);
  const f = n => Math.round(255*(l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)))));
  return [f(0), f(8), f(4)];
}
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2), 16));
const mix = (c, t, k) => css(c.map((v,i) => Math.round(v + (t[i]-v)*k)));

function palette(){
  if (Math.random() < .25) return ROOMS[Math.random()*ROOMS.length|0].map(c => c.slice());
  const base = Math.random()*360, wheel = WHEELS[Math.random()*WHEELS.length|0];
  const ls = shuffle([76, 64, 53, 42]);
  return wheel.map((d, i) => {
    const h = (base + d + (Math.random()-.5)*14 + 360) % 360;
    /* yellows want to be light and blues dark, or the set looks mixed up */
    const l = clamp(ls[i] + 9*Math.cos((h-52)*Math.PI/180), 28, 86);
    return hsl(h, 30 + Math.random()*24, l);
  });
}

/* ---------------------------------------------------------------- shapes */
/* every piece is a convex outline. Some are drawn through their corners and come
   out sharp, some are drawn round them and come out organic; a stick is just a
   very long one. All of them are cut to the same area, so a round of sticks and
   a round of pebbles fill the pit alike */
const KINDS = {
  ball:   { disc:16,                                 draw:'circle', pack:.76 },
  pebble: { n:[9,13], jitter:.30, stretch:[1,1.6],   draw:'smooth', pack:.74 },
  shard:  { n:[3,5],  jitter:.55, stretch:[1,2.1],   draw:'sharp',  pack:.64 },
  slab:   { n:[4,6],  jitter:.14, stretch:[1.2,2.9], draw:'sharp',  pack:.70 },
  petal:  { n:[7,9],  jitter:.24, stretch:[1.9,3.3], draw:'smooth', pack:.64 },
  tile:   { aspect:[1.05,2.4], round:.24,            draw:'round',  pack:.78 },
  plank:  { aspect:[2.6,4.6],  round:.10,            draw:'round',  pack:.60 },
  stick:  { aspect:[5,11],                           draw:'sharp',  pack:.46 }
};
const KEYS = Object.keys(KINDS);
const MAXV = 16;

function hull(p){                            /* monotone chain */
  p = p.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const x = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], hi = [];
  for (const q of p){ while (lo.length>1 && x(lo[lo.length-2],lo[lo.length-1],q) <= 0) lo.pop(); lo.push(q); }
  for (let i=p.length-1;i>=0;i--){ const q=p[i]; while (hi.length>1 && x(hi[hi.length-2],hi[hi.length-1],q) <= 0) hi.pop(); hi.push(q); }
  lo.pop(); hi.pop();
  return lo.concat(hi);
}

function grow(p, skin){
  const n = p.length, out = [], norm = [];
  for (let i=0;i<n;i++){
    const j = (i+1)%n;
    let nx = p[j][1]-p[i][1], ny = -(p[j][0]-p[i][0]);
    const l = Math.hypot(nx,ny) || 1; nx /= l; ny /= l;
    if (nx*(p[i][0]+p[j][0])*.5 + ny*(p[i][1]+p[j][1])*.5 < 0){ nx = -nx; ny = -ny; }
    norm.push([nx,ny]);
  }
  for (let i=0;i<n;i++){
    const a = norm[(i-1+n)%n], b = norm[i];
    const d = 1 + a[0]*b[0] + a[1]*b[1];
    const k = Math.min(skin/Math.max(d, 1e-4), skin*5);   /* a needle keeps its point */
    out.push([p[i][0] + (a[0]+b[0])*k, p[i][1] + (a[1]+b[1])*k]);
  }
  return out;
}

function template(kind, area, skin){
  const k = KINDS[kind];
  let p, corner = 0;
  if (k.aspect){
    const a = k.aspect[0] + Math.random()*(k.aspect[1]-k.aspect[0]);
    const w = Math.sqrt(area/a), l = a*w;
    p = [[-l/2,-w/2],[l/2,-w/2],[l/2,w/2],[-l/2,w/2]];
    corner = (k.round || 0)*w;
  } else if (k.disc){
    p = [];
    for (let i=0;i<k.disc;i++){
      const a = i/k.disc*6.2832;
      p.push([Math.cos(a), Math.sin(a)]);
    }
  } else {
    const n = k.n[0] + (Math.random()*(k.n[1]-k.n[0]+1)|0);
    const sx = k.stretch[0] + Math.random()*(k.stretch[1]-k.stretch[0]);
    p = [];
    for (let i=0;i<n;i++){
      const a = (i + (Math.random()-.5)*.55)/n * 6.2832;
      const r = 1 + (Math.random()-.5)*k.jitter*2;
      p.push([Math.cos(a)*r*sx, Math.sin(a)*r/Math.sqrt(sx)]);
    }
    p = hull(p);
  }

  /* area, centroid and second moment, all from the outline */
  let a2 = 0, cx = 0, cy = 0;
  for (let i=0;i<p.length;i++){
    const j = (i+1)%p.length, c = p[i][0]*p[j][1] - p[j][0]*p[i][1];
    a2 += c; cx += (p[i][0]+p[j][0])*c; cy += (p[i][1]+p[j][1])*c;
  }
  if (a2 < 0){ p.reverse(); a2 = -a2; cx = -cx; cy = -cy; }
  cx /= 3*a2; cy /= 3*a2;
  for (const q of p){ q[0] -= cx; q[1] -= cy; }

  if (!k.aspect){                            /* cut every piece to the same area */
    const s = Math.sqrt(area/(a2/2));
    for (const q of p){ q[0] *= s; q[1] *= s; }
  }

  /* what is drawn stays as it is; what collides is a hair larger all round, so
     the outlines on screen never meet however hard the heap presses down */
  const drawn = p.map(q => q.slice());
  p = grow(p, skin);

  let A = 0, J = 0, bound = 0;
  for (let i=0;i<p.length;i++){
    const j = (i+1)%p.length;
    const c = p[i][0]*p[j][1] - p[j][0]*p[i][1];
    A += c/2;
    J += c*(p[i][0]*p[i][0] + p[i][0]*p[j][0] + p[j][0]*p[j][0] +
            p[i][1]*p[i][1] + p[i][1]*p[j][1] + p[j][1]*p[j][1]);
    bound = Math.max(bound, Math.hypot(p[i][0], p[i][1]));
  }
  J /= 12;

  /* outward edge normals, settled once against the centroid */
  const v = new Float32Array(MAXV*2), nrm = new Float32Array(MAXV*2);
  for (let i=0;i<p.length;i++){
    const j = (i+1)%p.length;
    const ex = p[j][0]-p[i][0], ey = p[j][1]-p[i][1], el = Math.hypot(ex,ey) || 1;
    let nx = ey/el, ny = -ex/el;
    if (nx*(p[i][0]+p[j][0])*.5 + ny*(p[i][1]+p[j][1])*.5 < 0){ nx = -nx; ny = -ny; }
    v[i*2] = p[i][0]; v[i*2+1] = p[i][1];
    nrm[i*2] = nx; nrm[i*2+1] = ny;
  }

  /* the drawn outline: through the corners, round them, or off them entirely.
     A ball is a twelve-sided piece drawn as the circle between its two radii,
     so it neither bites into its neighbour nor stands off it */
  const path = new Path2D();
  if (k.draw === 'circle'){
    let r = 0;
    for (const q of drawn) r = Math.max(r, Math.hypot(q[0], q[1]));
    path.arc(0, 0, r*Math.cos(Math.PI/k.disc), 0, 6.2832);   /* inside its own corners */
  } else if (k.draw === 'round'){
    const w = drawn[1][0]-drawn[0][0], h = drawn[2][1]-drawn[1][1], r = Math.min(corner, w/2, h/2);
    const x = -w/2, y = -h/2;
    path.moveTo(x+r, y);
    path.lineTo(x+w-r, y);   path.arcTo(x+w, y,   x+w, y+r,   r);
    path.lineTo(x+w, y+h-r); path.arcTo(x+w, y+h, x+w-r, y+h, r);
    path.lineTo(x+r, y+h);   path.arcTo(x, y+h,   x, y+h-r,   r);
    path.lineTo(x, y+r);     path.arcTo(x, y,     x+r, y,     r);
  } else if (k.draw === 'smooth'){
    const mid = (i,j) => [(drawn[i][0]+drawn[j][0])/2, (drawn[i][1]+drawn[j][1])/2];
    let m = mid(drawn.length-1, 0);
    path.moveTo(m[0], m[1]);
    for (let i=0;i<drawn.length;i++){
      const j = (i+1)%drawn.length;
      m = mid(i, j);
      path.quadraticCurveTo(drawn[i][0], drawn[i][1], m[0], m[1]);
    }
  } else {
    path.moveTo(drawn[0][0], drawn[0][1]);
    for (let i=1;i<drawn.length;i++) path.lineTo(drawn[i][0], drawn[i][1]);
  }
  path.closePath();

  return { v, nrm, count: p.length, area: A, inertia: J, bound, path, kind, skin };
}

/* ------------------------------------------------------------- the world */
const G_PER_PX   = 280;    /* gravity, px/s² per px of size: a piece is 7cm across */
const SUB        = 5;      /* substeps a frame, */
const ITER       = 5;      /* and passes over the contacts within each */
const BETA       = 0.3;    /* how briskly an overlap is pushed out, */
const SLOP       = 0.1;    /* down to this much, which is left alone */
const MU_PIECE   = 0.28;   /* sliding friction, piece on piece. These turn, so unlike
                              a ball that cannot, a real sliding number belongs here */
const MU_WALL    = 0.40;
const REST       = 0.12;   /* pieces are not lively; a pile of them is dead */
const DRAG       = 0.30;   /* air, per second */
const DRAG_SPIN  = 0.90;   /* and against turning */
const DRAG_REST  = 1.20;   /* the pit itself, once the pouring has stopped */
const STILL      = 0.8;    /* piece-widths a second: below this nothing is going anywhere */
const HOLD       = 0.2;    /* seconds of that before the box goes up */
const TAIL       = 8;      /* under this the pit is only shuffling, */
const TAIL_SPEED = 3;      /* so play that part out at triple time */
const DEAD       = 0.35;   /* and it is properly at rest under this */
const LAST       = 1.2;    /* seconds it may take to get there */
const POUR_RATE  = 45;     /* pieces a second, enough of them in the air to read as rain */
const POUR_MIN   = 2;
const POUR_MAX   = 5;
const HOLD_BACK  = 0.28;   /* how often the last piece is kept back for a beat, */
const HOLD_WAIT  = [0.5, 1.2];  /* and how long the pit is left quiet before it lands */
const SETTLE_MAX = 4.5;

const cv = document.getElementById('pit');
const ctx = cv.getContext('2d', { alpha: false });

let W = 0, H = 0, dpr = 1, bg = null, ground = [];

let N = 0, live = 0, SIZE = 20;            /* SIZE: the radius a piece would have as a disc */
let bx, by, ba, vx, vy, va, pvx, pvy, pva, sx, sy, sa, tpl, col;
let invM, invI, bound;
let TPL = [], fills = [], rims = [], flats = [], lineW = 1;

/* world outlines, rebuilt every substep */
let wv, wn, wcount;

/* the broad phase: a grid of bounding circles, and the pairs it turns up */
let cell = 0, cols = 0, rows = 0, originY = 0, starts, cursor, items, pairA, pairB, np = 0;

/* contacts found by the position pass, replayed by the velocity pass */
let cA, cB, cnx, cny, crax, cray, crbx, crby, cdep, cwn, cwt, cjn, cjt, ctar, cpn, ckey,
    keyjn, keyjt, wallKey = 0, nc = 0, maxC = 0;

let G = 0, vmax = 0, wmax = 0, bounceMin = 0, damp = DRAG, maxBound = 0;

/* ------------------------------------------------------------------ round */
let phase = 'idle';
let pourT = 0, pourTime = 0, pourTo = 0, calm = 0, simTime = 0, settleUntil = 0, judged = false,
    asked = false, busy = Infinity, deck = null, deckAt = 0;
let holdOne = false, holdAt = -1, holdWait = 0;

const el = id => document.getElementById(id);
const statusEl = el('status'), startCard = el('startCard'), skipBtn = el('skipBtn'),
      guessCard = el('guessCard'), guessInput = el('guessInput'), resultCard = el('resultCard');

function fit(){
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = w; H = h;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bg = ctx.createLinearGradient(0,0,0,H);
  const style = getComputedStyle(document.body);
  const top = style.getPropertyValue('--ink').trim() || '#ECE5DB';
  const bot = style.getPropertyValue('--floor').trim() || '#E1D8C9';
  bg.addColorStop(0, top);
  bg.addColorStop(1, bot);
  /* the ground in bands, to draw the moat round each piece in the shade of the
     ground behind it */
  const a = hex(top), b = hex(bot);
  ground = [];
  for (let i=0;i<12;i++) ground.push(mix(a, b, i/11));
}

/* a sheet of speckle in each colour, so a fill has some tooth to it. It is laid
   in the piece's own frame, so the grain turns with the piece */
function inks(colours){
  fills = []; rims = []; flats = [];
  for (const c of colours){
    const t = document.createElement('canvas');
    t.width = t.height = 96;
    const g = t.getContext('2d');
    g.fillStyle = css(c); g.fillRect(0,0,96,96);
    const img = g.getImageData(0,0,96,96), d = img.data;
    for (let i=0;i<d.length;i+=4){
      const n = (Math.random()-.5)*Math.random()*18;
      d[i] = clamp(d[i]+n,0,255); d[i+1] = clamp(d[i+1]+n,0,255); d[i+2] = clamp(d[i+2]+n,0,255);
    }
    g.putImageData(img,0,0);
    fills.push(ctx.createPattern(t,'repeat'));
    rims.push(mix(c,[0,0,0],.28));
    flats.push(css(c));
  }
}

function allocate(n){
  N = n; live = 0;
  const f = () => new Float32Array(n);
  bx=f(); by=f(); ba=f(); vx=f(); vy=f(); va=f(); pvx=f(); pvy=f(); pva=f(); sx=f(); sy=f(); sa=f();
  invM=f(); invI=f(); bound=f();
  tpl = new Uint8Array(n); col = new Uint8Array(n); wcount = new Uint8Array(n);
  wv = new Float32Array(n*MAXV*2); wn = new Float32Array(n*MAXV*2);
  maxC = n*10 + 64;
  cA = new Int32Array(maxC); cB = new Int32Array(maxC);
  cnx = new Float32Array(maxC); cny = new Float32Array(maxC);
  crax = new Float32Array(maxC); cray = new Float32Array(maxC);
  crbx = new Float32Array(maxC); crby = new Float32Array(maxC);
  cdep = new Float32Array(maxC); cwn = new Float32Array(maxC); cwt = new Float32Array(maxC);
  cjn = new Float32Array(maxC); cjt = new Float32Array(maxC); ctar = new Float32Array(maxC);
  cpn = new Float32Array(maxC); ckey = new Int32Array(maxC);
  wallKey = n*n*2;
  keyjn = new Float32Array(wallKey + n*MAXV*3);
  keyjt = new Float32Array(keyjn.length);
  pairA = new Int32Array(n*14); pairB = new Int32Array(n*14);
  deck = new Uint8Array(n);
  for (let i=0;i<n;i++) deck[i] = i & 3;
  shuffle(deck);
  deckAt = 0;
}

function grid(){
  cell = Math.max(8, maxBound*2);
  cols = Math.max(1, Math.ceil(W/cell) + 1);
  originY = -6*cell;
  rows = Math.max(1, Math.ceil((H-originY)/cell) + 1);
  const nCells = cols*rows;
  if (!starts || starts.length !== nCells+1){
    starts = new Int32Array(nCells+1);
    cursor = new Int32Array(nCells+1);
  }
  if (!items || items.length < N) items = new Int32Array(N);
}

function newRound(){
  fit();
  const minDim = Math.min(W,H);
  SIZE = Math.round((0.030 + Math.random()*0.040) * minDim * 2)/2;
  const area = Math.PI*SIZE*SIZE;

  /* one kind in play, or two — never a jumble of everything */
  const kinds = shuffle(KEYS.slice()).slice(0, Math.random() < .35 ? 1 : 2);

  /* and how far the pieces differ in size within the round: a few rounds are cut
     all of a size, the rest hold some larger ones among the smaller. The draw is
     lopsided upwards, so big pieces are the exception rather than half of them */
  const spread = Math.random() < .2 ? 0 : 0.35 + Math.random()*0.65;
  lineW = Math.max(.8, SIZE*.05);
  const skin = lineW/2 + Math.max(1.5, SIZE*0.05);
  TPL = [];
  maxBound = 0;
  let mean = 0;
  for (let i=0;i<12;i++){
    const f = Math.exp((Math.random() - 0.42)*spread*1.3);
    const t = template(kinds[i % kinds.length], area*f*f, skin);
    TPL.push(t);
    mean += t.area;
    maxBound = Math.max(maxBound, t.bound);
  }
  mean /= TPL.length;                        /* what the count has to be reckoned on */
  inks(palette());

  let pack = 1;
  for (const k of kinds) pack = Math.min(pack, KINDS[k].pack);
  const fill = 0.50 + Math.random()*0.26;
  let n = Math.round(W*H*fill*pack*0.94/mean * (0.97 + Math.random()*0.06));
  n = Math.max(20, Math.min(200, n));

  G = G_PER_PX * SIZE;
  vmax = SIZE * 70;
  wmax = 25;
  bounceMin = 0.5*Math.sqrt(G*SIZE);

  allocate(n);
  for (let i=0;i<n;i++){
    const t = i % TPL.length;
    tpl[i] = t;
    invM[i] = 1/TPL[t].area;
    invI[i] = 1/TPL[t].inertia;
    bound[i] = TPL[t].bound;
    wcount[i] = TPL[t].count;
  }
  shuffle(tpl);
  for (let i=0;i<n;i++){                     /* keep the rest in step with the shuffle */
    const t = tpl[i];
    invM[i] = 1/TPL[t].area; invI[i] = 1/TPL[t].inertia;
    bound[i] = TPL[t].bound; wcount[i] = TPL[t].count;
  }
  grid();
  pour();
}

function pour(){
  live = 0; deckAt = 0; pourT = 0; calm = 0; simTime = 0; damp = DRAG; busy = Infinity;
  asked = false;
  pourTime = Math.min(POUR_MAX, Math.max(POUR_MIN, N/POUR_RATE));
  holdOne = N > 3 && Math.random() < HOLD_BACK;
  holdAt = -1;
  holdWait = HOLD_WAIT[0] + Math.random()*(HOLD_WAIT[1]-HOLD_WAIT[0]);
  pourTo = N - (holdOne ? 1 : 0);
  if (holdOne){                              /* and let it be the biggest cut of the round */
    let big = 0;
    for (let i=1;i<TPL.length;i++) if (TPL[i].area > TPL[big].area) big = i;
    const last = N-1;
    tpl[last] = big;
    invM[last] = 1/TPL[big].area; invI[last] = 1/TPL[big].inertia;
    bound[last] = TPL[big].bound; wcount[last] = TPL[big].count;
  }
  phase = 'dropping';
}

function spawnOne(){
  const b = bound[live], lo = Math.min(b*1.1, W/2), hi = Math.max(W - b*1.1, W/2);
  for (let t=0;t<14;t++){
    const px = lo + Math.random()*(hi-lo);
    const py = -maxBound*2 - Math.random()*maxBound*2.5;
    let ok = true;
    for (let k=Math.max(0,live-48); k<live; k++){
      const dx = bx[k]-px, dy = by[k]-py, r = bound[k] + b;
      if (dx*dx + dy*dy < r*r*1.15){ ok = false; break; }
    }
    if (!ok) continue;
    const u = Math.sqrt(G*SIZE);
    bx[live]=px; by[live]=py; ba[live]=Math.random()*6.2832;
    vx[live]=(Math.random()-.5)*u*.35; vy[live]=u*.2; va[live]=(Math.random()-.5)*4;
    col[live]=deck[deckAt++];
    live++;
    return true;
  }
  return false;
}

/* ----------------------------------------------------------------- solver */
function outlines(){
  for (let i=0;i<live;i++){
    const t = TPL[tpl[i]], c = Math.cos(ba[i]), s = Math.sin(ba[i]);
    const o = i*MAXV*2, x = bx[i], y = by[i];
    for (let k=0;k<t.count;k++){
      const px = t.v[k*2], py = t.v[k*2+1];
      wv[o+k*2]   = x + px*c - py*s;
      wv[o+k*2+1] = y + px*s + py*c;
      const nx = t.nrm[k*2], ny = t.nrm[k*2+1];
      wn[o+k*2]   = nx*c - ny*s;
      wn[o+k*2+1] = nx*s + ny*c;
    }
  }
}

function broad(){
  const nCells = cols*rows, inv = 1/cell;
  starts.fill(0);
  const cellOf = i => {
    let cx = (bx[i]*inv)|0; if (cx<0) cx=0; else if (cx>=cols) cx=cols-1;
    let cy = ((by[i]-originY)*inv)|0; if (cy<0) cy=0; else if (cy>=rows) cy=rows-1;
    return cy*cols+cx;
  };
  for (let i=0;i<live;i++) starts[cellOf(i)+1]++;
  for (let c=0;c<nCells;c++) starts[c+1]+=starts[c];
  cursor.set(starts);
  for (let i=0;i<live;i++) items[cursor[cellOf(i)]++] = i;

  np = 0;
  const lim = pairA.length, slop = maxBound*0.12;
  const add = (a,b) => {
    if (np >= lim) return;
    const i = a < b ? a : b, j = a < b ? b : a;
    const dx = bx[j]-bx[i], dy = by[j]-by[i], r = bound[i]+bound[j]+slop;
    if (dx*dx+dy*dy > r*r) return;
    pairA[np]=i; pairB[np]=j; np++;
  };
  for (let cy=0; cy<rows; cy++){
    const up = cy+1 < rows;
    for (let cx=0; cx<cols; cx++){
      const c = cy*cols+cx, a0 = starts[c], a1 = starts[c+1];
      if (a0 === a1) continue;
      for (let a=a0; a<a1; a++){
        const i = items[a];
        for (let b=a+1; b<a1; b++) add(i, items[b]);
        if (cx+1 < cols){ for (let b=starts[c+1]; b<starts[c+2]; b++) add(i, items[b]); }
        if (up){
          const base = c+cols;
          const from = cx>0 ? base-1 : base, to = cx+1<cols ? base+1 : base;
          for (let b=starts[from]; b<starts[to+1]; b++) add(i, items[b]);
        }
      }
    }
  }
}

/* how far apart A and B are along A's least favourable face normal */
let satFace = 0;
function separation(A, B){
  const oa = A*MAXV*2, ob = B*MAXV*2, na = wcount[A], nb = wcount[B];
  let best = -Infinity, face = 0;
  for (let i=0;i<na;i++){
    const nx = wn[oa+i*2], ny = wn[oa+i*2+1];
    let lo = Infinity;
    for (let j=0;j<nb;j++){
      const d = wv[ob+j*2]*nx + wv[ob+j*2+1]*ny;
      if (d < lo) lo = d;
    }
    const s = lo - (wv[oa+i*2]*nx + wv[oa+i*2+1]*ny);
    if (s > best){ best = s; face = i; }
  }
  satFace = face;
  return best;
}

/* the contact points: clip the incident face against the reference face's sides,
   which is what gives a flat piece two points to rest on instead of one */
const cpx = [0,0], cpy = [0,0], cpd = [0,0];
function manifold(A, B){
  const sa = separation(A,B); if (sa >= 0) return 0;
  const fa = satFace;
  const sb = separation(B,A); if (sb >= 0) return 0;
  const fb = satFace;

  let R, I, rf, flip;
  if (sa > sb - 1e-3){ R = A; I = B; rf = fa; flip = false; }
  else               { R = B; I = A; rf = fb; flip = true;  }

  const or_ = R*MAXV*2, oi = I*MAXV*2, nr = wcount[R], ni = wcount[I];
  const rnx = wn[or_+rf*2], rny = wn[or_+rf*2+1];
  const r1x = wv[or_+rf*2], r1y = wv[or_+rf*2+1];
  const rf2 = (rf+1)%nr;
  const r2x = wv[or_+rf2*2], r2y = wv[or_+rf2*2+1];

  let inc = 0, worst = Infinity;             /* the incident face turns to meet it */
  for (let k=0;k<ni;k++){
    const d = wn[oi+k*2]*rnx + wn[oi+k*2+1]*rny;
    if (d < worst){ worst = d; inc = k; }
  }
  const i2 = (inc+1)%ni;
  let ax = wv[oi+inc*2], ay = wv[oi+inc*2+1];
  let bx2 = wv[oi+i2*2], by2 = wv[oi+i2*2+1];

  /* clip to the slab between the reference face's ends */
  const ex = r2x-r1x, ey = r2y-r1y, el = Math.hypot(ex,ey) || 1;
  const sx = ex/el, sy = ey/el;
  const clip = (nx, ny, ox, oy) => {
    const da = (ax-ox)*nx + (ay-oy)*ny, db = (bx2-ox)*nx + (by2-oy)*ny;
    if (da >= 0 && db >= 0) return true;
    if (da < 0 && db < 0) return false;
    const t = da/(da-db);
    const px = ax + (bx2-ax)*t, py = ay + (by2-ay)*t;
    if (da < 0){ ax = px; ay = py; } else { bx2 = px; by2 = py; }
    return true;
  };
  if (!clip(sx, sy, r1x, r1y)) return 0;
  if (!clip(-sx, -sy, r2x, r2y)) return 0;

  let n = 0;
  const da = -((ax-r1x)*rnx + (ay-r1y)*rny);
  if (da > 0){ cpx[n]=ax; cpy[n]=ay; cpd[n]=da; n++; }
  const db = -((bx2-r1x)*rnx + (by2-r1y)*rny);
  if (db > 0){ cpx[n]=bx2; cpy[n]=by2; cpd[n]=db; n++; }
  if (!n) return 0;

  /* hand the normal back pointing from A to B, whichever way round it was found */
  const nx = flip ? -rnx : rnx, ny = flip ? -rny : rny;
  const lo = A < B ? A : B, hi = A < B ? B : A;
  for (let k=0;k<n;k++) record(A, B, nx, ny, cpx[k], cpy[k], cpd[k], (lo*N+hi)*2+k);
  return n;
}

/* a contact is written down once and then solved over and over, each pass adding
   to the impulse it has already spent. Shoving positions apart instead and reading
   the velocity back off them leaves a pile buzzing: every push it has not yet
   converged on comes back as speed */
function record(A, B, nx, ny, px, py, depth, key){
  if (nc >= maxC) return;
  const rax = A < 0 ? 0 : px-bx[A], ray = A < 0 ? 0 : py-by[A];
  const rbx = B < 0 ? 0 : px-bx[B], rby = B < 0 ? 0 : py-by[B];
  const imA = A < 0 ? 0 : invM[A], iiA = A < 0 ? 0 : invI[A];
  const imB = B < 0 ? 0 : invM[B], iiB = B < 0 ? 0 : invI[B];
  const ca = rax*ny - ray*nx, cb = rbx*ny - rby*nx;
  const w = imA + iiA*ca*ca + imB + iiB*cb*cb;
  if (w <= 0) return;
  const tx = -ny, ty = nx;
  const ta = rax*ty - ray*tx, tb = rbx*ty - rby*tx;
  const vax = A < 0 ? 0 : vx[A] - va[A]*ray, vay = A < 0 ? 0 : vy[A] + va[A]*rax;
  const vbx = B < 0 ? 0 : vx[B] - va[B]*rby, vby = B < 0 ? 0 : vy[B] + va[B]*rbx;
  const vn = (vbx-vax)*nx + (vby-vay)*ny;
  cA[nc]=A; cB[nc]=B; cnx[nc]=nx; cny[nc]=ny;
  crax[nc]=rax; cray[nc]=ray; crbx[nc]=rbx; crby[nc]=rby;
  cdep[nc]=depth; cwn[nc]=w;
  cwt[nc]=imA + iiA*ta*ta + imB + iiB*tb*tb;
  ckey[nc]=key; cpn[nc]=0;
  ctar[nc] = vn < -bounceMin ? -REST*vn : 0;

  /* pick up the push this contact was already making last substep, and hand it
     back to the pieces now. Carrying the number without spending it is the same
     as starting from nothing: the pile has to hold itself up from scratch every
     substep, and never quite manages */
  const jn = keyjn[key], jt = keyjt[key];
  cjn[nc] = jn; cjt[nc] = jt;
  if (jn !== 0 || jt !== 0){
    const ix = nx*jn + tx*jt, iy = ny*jn + ty*jt;
    if (A >= 0){ vx[A] -= ix*imA; vy[A] -= iy*imA; va[A] -= iiA*(rax*iy - ray*ix); }
    if (B >= 0){ vx[B] += ix*imB; vy[B] += iy*imB; va[B] += iiB*(rbx*iy - rby*ix); }
  }
  nc++;
}

/* every corner outside a wall is its own contact, which is what lets a flat
   piece lie down on the floor instead of rocking on a point */
function walls(){
  for (let i=0;i<live;i++){
    const o = i*MAXV*2, n = wcount[i];
    for (let k=0;k<n;k++){
      const px = wv[o+k*2], py = wv[o+k*2+1];
      const key = wallKey + (i*MAXV + k)*3;
      if (px < 0)      record(-1, i,  1, 0, px, py, -px, key);
      else if (px > W) record(-1, i, -1, 0, px, py, px-W, key+1);
      if (py > H)      record(-1, i,  0,-1, px, py, py-H, key+2);
    }
  }
}

/* Two solves over the same contacts. The first is the real one — momentum, bounce
   and friction. The second pushes the overlaps out through a pretend velocity that
   moves the pieces and is then thrown away: send that push through the real
   velocities instead and the pack never stops shivering, because every overlap the
   iterations have not yet resolved is handed back as speed */
function solve(h){
  const push = BETA/h;
  for (let i=0;i<live;i++){ pvx[i]=0; pvy[i]=0; pva[i]=0; }
  for (let k=0;k<nc;k++) cpn[k] = 0;
  for (let it=0; it<ITER; it++){
    for (let k=0;k<nc;k++){
      const A = cA[k], B = cB[k], nx = cnx[k], ny = cny[k];
      const rax = crax[k], ray = cray[k], rbx = crbx[k], rby = crby[k];
      const imA = A < 0 ? 0 : invM[A], iiA = A < 0 ? 0 : invI[A];
      const imB = B < 0 ? 0 : invM[B], iiB = B < 0 ? 0 : invI[B];
      const ca = rax*ny - ray*nx, cb = rbx*ny - rby*nx;

      let vax = A < 0 ? 0 : vx[A] - va[A]*ray, vay = A < 0 ? 0 : vy[A] + va[A]*rax;
      let vbx = B < 0 ? 0 : vx[B] - va[B]*rby, vby = B < 0 ? 0 : vy[B] + va[B]*rbx;
      const vn = (vbx-vax)*nx + (vby-vay)*ny;


      let dj = (ctar[k] - vn)/cwn[k];
      const on = cjn[k];
      cjn[k] = Math.max(0, on + dj);
      dj = cjn[k] - on;
      if (A >= 0){ vx[A] -= nx*dj*imA; vy[A] -= ny*dj*imA; va[A] -= iiA*ca*dj; }
      if (B >= 0){ vx[B] += nx*dj*imB; vy[B] += ny*dj*imB; va[B] += iiB*cb*dj; }

      const tx = -ny, ty = nx;
      const ta = rax*ty - ray*tx, tb = rbx*ty - rby*tx;
      vax = A < 0 ? 0 : vx[A] - va[A]*ray; vay = A < 0 ? 0 : vy[A] + va[A]*rax;
      vbx = B < 0 ? 0 : vx[B] - va[B]*rby; vby = B < 0 ? 0 : vy[B] + va[B]*rbx;
      const vt = (vbx-vax)*tx + (vby-vay)*ty;
      let djt = -vt/cwt[k];
      const lim = ((A < 0 || B < 0) ? MU_WALL : MU_PIECE)*cjn[k];
      const ot = cjt[k];
      cjt[k] = clamp(ot + djt, -lim, lim);
      djt = cjt[k] - ot;
      if (A >= 0){ vx[A] -= tx*djt*imA; vy[A] -= ty*djt*imA; va[A] -= iiA*ta*djt; }
      if (B >= 0){ vx[B] += tx*djt*imB; vy[B] += ty*djt*imB; va[B] += iiB*tb*djt; }

      const want = push*Math.max(0, cdep[k]-SLOP);
      if (want <= 0) continue;
      const pax = A < 0 ? 0 : pvx[A] - pva[A]*ray, pay = A < 0 ? 0 : pvy[A] + pva[A]*rax;
      const pbx = B < 0 ? 0 : pvx[B] - pva[B]*rby, pby = B < 0 ? 0 : pvy[B] + pva[B]*rbx;
      let dp = (want - ((pbx-pax)*nx + (pby-pay)*ny))/cwn[k];
      const op = cpn[k];
      cpn[k] = Math.max(0, op + dp);
      dp = cpn[k] - op;
      if (A >= 0){ pvx[A] -= nx*dp*imA; pvy[A] -= ny*dp*imA; pva[A] -= iiA*ca*dp; }
      if (B >= 0){ pvx[B] += nx*dp*imB; pvy[B] += ny*dp*imB; pva[B] += iiB*cb*dp; }
    }
  }
}

/* At the moment of freezing, push the last of the overlap out: positions only,
   nothing added to any velocity. A soft solver always leaves a little penetration
   and the odd jammed contact leaves rather more, and the pit is about to be looked
   at rather than simulated */
function separate(){
  keyjn.fill(0); keyjt.fill(0);
  const until = performance.now() + 60 + live*0.5;   /* a one-off, on a pit about to stop */
  for (let pass=0; pass<90 && performance.now() < until; pass++){
    broad();
    outlines();
    nc = 0;
    for (let k=0;k<np;k++) manifold(pairA[k], pairB[k]);
    walls();
    let worst = 0;
    for (let k=0;k<nc;k++) if (cdep[k] > worst) worst = cdep[k];
    if (worst < 0.05) return;
    for (let k=0;k<nc;k++){
      const A = cA[k], B = cB[k], nx = cnx[k], ny = cny[k];
      const rax = crax[k], ray = cray[k], rbx = crbx[k], rby = crby[k];
      const imA = A < 0 ? 0 : invM[A], iiA = A < 0 ? 0 : invI[A];
      const imB = B < 0 ? 0 : invM[B], iiB = B < 0 ? 0 : invI[B];
      const ca = rax*ny - ray*nx, cb = rbx*ny - rby*nx;
      const w = imA + iiA*ca*ca + imB + iiB*cb*cb;
      if (w <= 0) continue;
      const lam = 0.85*cdep[k]/w;
      if (A >= 0){ bx[A] -= nx*lam*imA; by[A] -= ny*lam*imA; ba[A] -= iiA*ca*lam; }
      if (B >= 0){ bx[B] += nx*lam*imB; by[B] += ny*lam*imB; ba[B] += iiB*cb*lam; }
    }
  }
}

function step(dt){
  const h = dt/SUB, dl = Math.max(0, 1 - damp*h), dA = Math.max(0, 1 - (damp+DRAG_SPIN)*h);
  const gh = G*h, creep = damp === DRAG_REST, slow = SIZE*0.5;
  keyjn.fill(0); keyjt.fill(0);              /* a frame starts with nothing spent */
  for (let s=0;s<SUB;s++){
    for (let i=0;i<live;i++){
      vy[i] = (vy[i] + gh)*dl; vx[i] *= dl; va[i] *= dA;
      if (creep && Math.hypot(vx[i],vy[i]) + Math.abs(va[i])*bound[i] < slow){
        vx[i] *= .88; vy[i] *= .88; va[i] *= .88;
      }
      const sp = Math.hypot(vx[i], vy[i]);
      if (sp > vmax){ const k = vmax/sp; vx[i]*=k; vy[i]*=k; }
      if (va[i] > wmax) va[i] = wmax; else if (va[i] < -wmax) va[i] = -wmax;
    }
    broad();
    outlines();
    nc = 0;
    for (let k=0;k<np;k++) manifold(pairA[k], pairB[k]);
    walls();
    solve(h);
    for (let k=0;k<nc;k++){ keyjn[ckey[k]] = cjn[k]; keyjt[ckey[k]] = cjt[k]; }
    for (let i=0;i<live;i++){
      bx[i]+=(vx[i]+pvx[i])*h; by[i]+=(vy[i]+pvy[i])*h; ba[i]+=(va[i]+pva[i])*h;
    }
  }
  simTime += dt;
}

/* How still is it? Not by the speeds: a heap of long pieces buzzes in place long
   after it has stopped going anywhere, and the eye sees the going-anywhere. So
   take a copy every so often and ask how far the furthest piece actually travelled */
let snapAt = -1;
function snap(){
  for (let i=0;i<live;i++){ sx[i]=bx[i]; sy[i]=by[i]; sa[i]=ba[i]; }
  snapAt = simTime;
}
function travelled(){
  const span = simTime - snapAt;
  if (snapAt < 0 || live === 0){ snap(); return Infinity; }
  if (span < 0.18) return busy;
  let m = 0;
  for (let i=0;i<live;i++){
    const d = Math.hypot(bx[i]-sx[i], by[i]-sy[i]) + Math.abs(ba[i]-sa[i])*bound[i];
    if (d > m) m = d;
  }
  snap();
  return m/span;
}

/* -------------------------------------------------------------- confetti */
/* only for an exact answer, and only where the viewer will have movement. It is
   fired from inside the answer card, in a fan aimed away from the corner it sits
   in — and since the card is a layer above the canvas, every piece starts hidden
   behind it and appears at its edges */
const bits = [];
function shower(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = resultCard.getBoundingClientRect();
  const ox = r.width ? r.left : W*0.7, oy = r.height ? r.top : 20;
  const cw = r.width || 200, ch = r.height || 90;
  const s = Math.min(1.4, Math.min(W,H)/620), reach = Math.hypot(W,H);
  for (let i=0;i<220;i++){
    const a = 2.44 + (Math.random()-.5)*2.6;   /* down, left, and up over the pit */
    const v = (0.25 + Math.pow(Math.random(), .7))*reach*0.75;
    bits.push({
      x: ox + Math.random()*cw, y: oy + Math.random()*ch,
      vx: Math.cos(a)*v, vy: Math.sin(a)*v,
      w: (5 + Math.random()*8)*s, h: (3 + Math.random()*6)*s,
      a: Math.random()*6.2832, spin: (Math.random()-.5)*14,
      turn: Math.random()*6.2832, rate: 4 + Math.random()*7,
      sway: Math.random()*6.2832,
      c: flats[Math.random()*flats.length|0]
    });
  }
}

function flutter(dt){
  for (let i=bits.length-1;i>=0;i--){
    const b = bits[i];
    b.sway += dt*b.rate;
    b.vy = (b.vy + 380*dt)*(1 - 1.8*dt);
    b.vx = (b.vx + Math.sin(b.sway)*70*dt)*(1 - 1.8*dt);
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.a += b.spin*dt; b.turn += b.rate*dt;
    if (b.y > H + 40 || b.x < -60 || b.x > W + 60) bits.splice(i,1);
  }
}

/* ---------------------------------------------------------------- drawing */
function draw(){
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.lineWidth = lineW;
  ctx.lineJoin = 'round';
  const moat = lineW + 3;
  for (let i=0;i<live;i++){
    if (by[i] + bound[i] < 0) continue;
    const t = TPL[tpl[i]];
    ctx.save();
    ctx.translate(bx[i], by[i]);
    ctx.rotate(ba[i]);
    /* cut a little ground round this piece before laying it down, so that whatever
       was drawn before it cannot share a pixel with it however the two are sitting */
    ctx.lineWidth = moat;
    ctx.strokeStyle = ground[clamp((by[i]/H*11)|0, 0, 11)];
    ctx.stroke(t.path);
    ctx.lineWidth = lineW;
    ctx.fillStyle = fills[col[i]];
    ctx.fill(t.path);
    ctx.strokeStyle = rims[col[i]];
    ctx.stroke(t.path);
    ctx.restore();
  }
  for (const b of bits){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.a);
    ctx.scale(Math.cos(b.turn), 1);         /* the flat of it turning over */
    ctx.fillStyle = b.c;
    ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    ctx.restore();
  }
}

/* ------------------------------------------------------------------- game */
function setStatus(t){ statusEl.textContent = t; }

function advance(dt){
  if (phase === 'dropping'){
    /* the rain swells and thins rather than running flat out and stopping dead:
       the count due by now follows a smooth curve, so the rate is nothing at
       either end and half again over the mean in the middle */
    pourT += dt;
    const p = Math.min(1, pourT/pourTime);
    const due = Math.round(pourTo * p*p*(3 - 2*p));
    while (live < due && spawnOne());
    step(dt);
    if (live >= pourTo) settle('settling');
  } else if (phase === 'settling'){
    step(dt);
    busy = travelled();
    calm = busy < SIZE*STILL ? calm + dt : 0;

    /* one piece kept back: let the pit go quiet, leave a beat, then drop it */
    if (holdOne){
      if (holdAt < 0 && busy < SIZE*STILL) holdAt = simTime;
      const due = (holdAt >= 0 && simTime - holdAt > holdWait) || simTime > settleUntil;
      if (due && spawnOne()){
        holdOne = false;
        calm = 0;
        settleUntil = simTime + SETTLE_MAX;
        snapAt = -1;
      }
    }

    if (!asked && !holdOne && (calm > HOLD || simTime > settleUntil)) ask();
    if (asked && (busy < SIZE*DEAD || simTime > settleUntil + LAST)) rest();
  }
}

function settle(label){
  phase = 'settling';
  damp = DRAG_REST;
  calm = 0;
  snapAt = -1;
  settleUntil = simTime + SETTLE_MAX;
  setStatus(label);
}

/* the box goes up while the last of the motion plays out */
function ask(){
  asked = true;
  skipBtn.hidden = true;
  if (judged){                       /* the pit was only disturbed; the answer stands */
    resultCard.hidden = false;
    setStatus('there were ' + N);
    return;
  }
  guessCard.hidden = false;
  setStatus('count them');
  if (!matchMedia('(hover: none)').matches) guessInput.focus();
}

function rest(){
  separate();
  phase = judged ? 'result' : 'guess';
  needsDraw = true;
}

let last = 0, hurry = false, needsDraw = true;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(1/30, last ? (now-last)/1000 : 1/60);
  last = now;
  const moving = phase === 'dropping' || phase === 'settling';
  if (!moving && !bits.length && !needsDraw) return;
  needsDraw = false;
  if (bits.length) flutter(dt);
  if (moving){
    if (hurry){
      /* fast-forward in fixed steps, a slice of a frame at a time, so the page
         still answers while the pit fills itself */
      const until = performance.now() + 13;
      do { advance(1/60); }
      while ((phase === 'dropping' || phase === 'settling') && performance.now() < until);
    } else if (phase === 'settling' && !asked && busy < SIZE*TAIL){
      /* what is left is a slow shuffle into the hollows. Damping it away would
         freeze the pile half-packed, so run the same motion at triple time
         instead — the pit lands where it would have, sooner */
      for (let k=0; k<TAIL_SPEED && phase === 'settling'; k++) advance(1/60);
    } else {
      advance(dt);
    }
  }
  draw();
}

function start(){
  bits.length = 0;
  startCard.hidden = true;
  resultCard.hidden = true;
  guessCard.hidden = true;
  newRound();
  judged = false;
  guessInput.value = '';
  hurry = matchMedia('(prefers-reduced-motion: reduce)').matches;
  skipBtn.hidden = hurry;
  setStatus(hurry ? 'filling' : 'dropping');
}

function verdictFor(pct){
  if (pct === 0) return 'Spot on.';
  if (pct <= 1)  return 'All but exact.';
  if (pct <= 3)  return 'Remarkably close.';
  if (pct <= 7)  return 'Close.';
  if (pct <= 15) return 'Near enough.';
  if (pct <= 30) return 'Some way off.';
  return 'Miles off.';
}

const BEST = 'shapepit.best', WAS = 'ballpit.best';   /* it was called Ball Pit once */
function readBest(){
  try {
    const v = JSON.parse(localStorage.getItem(BEST) ?? localStorage.getItem(WAS));
    return v && Number.isFinite(v.pct) && Number.isFinite(v.n) ? v : null;
  } catch { return null; }
}
function writeBest(v){ try { localStorage.setItem(BEST, JSON.stringify(v)); } catch { /* private window */ } }

function judge(guess){
  const err = Math.abs(guess - N), pct = err/N*100;
  phase = 'result';
  judged = true;
  guessCard.hidden = true;
  resultCard.hidden = false;
  setStatus('there were ' + N);
  el('verdict').textContent = verdictFor(pct);
  if (err === 0) shower();
  el('detail').innerHTML = err === 0
    ? `Both of us say <b>${N}</b>.`
    : `You said <b>${guess}</b>. There were <b>${N}</b> — ${err} ${err===1?'piece':'pieces'} ` +
      `${guess > N ? 'over' : 'under'}, ${pct < 10 ? pct.toFixed(1) : Math.round(pct)}%.`;

  const was = readBest();
  const pretty = v => v === 0 ? 'exact' : (v < 10 ? v.toFixed(1) : Math.round(v)) + '% off';
  if (!was || pct < was.pct) writeBest({ pct, n: N });
  el('best').textContent = !was ? ''
    : pct < was.pct ? `A new best: ${pretty(pct)}, where it was ${pretty(was.pct)}.`
    : `Best so far: ${pretty(was.pct)}, out of ${was.n}.`;
  el('againBtn').focus();
}

el('dropBtn').addEventListener('click', start);
el('againBtn').addEventListener('click', start);
skipBtn.addEventListener('click', () => { hurry = true; skipBtn.hidden = true; setStatus('filling'); });

guessCard.addEventListener('submit', e => {
  e.preventDefault();
  const g = Math.round(Number(guessInput.value));
  if (!Number.isFinite(g) || g < 1){ guessInput.focus(); return; }
  judge(g);
});

/* the ground and the pit are painted from the stylesheet, so a change of theme
   means reading it again */
const repaint = () => { fit(); needsDraw = true; };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributeFilter: ['data-theme'] });

/* the pit is the window; if the window changes shape, tip the same pieces back in
   rather than squeezing a settled pile sideways, which only jams it */
let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  needsDraw = true;
  resizeTimer = setTimeout(() => {
    const oldW = W, oldH = H;
    fit();
    if (phase === 'idle') return;
    if (Math.abs(W-oldW) < 2 && Math.abs(H-oldH) < 2) return;
    const small = W === oldW && Math.abs(H-oldH) < oldH*0.15;
    if (small){
      for (let i=0;i<live;i++) by[i] = Math.min(by[i], H-bound[i]);
      grid();
      if (phase !== 'dropping') for (let k=0;k<40; k++) step(1/60);
      return;
    }
    guessCard.hidden = true;
    resultCard.hidden = true;
    const k = Math.sqrt((W*H)/(oldW*oldH));   /* keep the pit as full as it was */
    SIZE = Math.max(3, SIZE*k);
    maxBound = 0;
    lineW = Math.max(.8, SIZE*.05);
    const skin = lineW/2 + Math.max(1.5, SIZE*0.05);
    TPL = TPL.map(t => {
      const s = template(t.kind, t.area*k*k, skin);
      maxBound = Math.max(maxBound, s.bound);
      return s;
    });
    G = G_PER_PX*SIZE; vmax = SIZE*70; bounceMin = 0.5*Math.sqrt(G*SIZE);
    for (let i=0;i<N;i++){
      const t = tpl[i];
      invM[i] = 1/TPL[t].area; invI[i] = 1/TPL[t].inertia;
      bound[i] = TPL[t].bound; wcount[i] = TPL[t].count;
    }
    grid();
    pour();
    hurry = true;
    setStatus('filling');
  }, 160);
});

/* ?debug hands over the answer, for anyone poking at the simulation */
if (new URLSearchParams(location.search).has('debug')){
  window.pit = () => {
    if (!bx) return { phase, asked, count: N, live: 0, r: SIZE, w: W, h: H };
    let lo = Infinity, hiY = -Infinity, loX = Infinity, hiX = -Infinity;
    for (let i=0;i<live;i++){
      const o = i*MAXV*2;
      for (let k=0;k<wcount[i];k++){
        const px = wv[o+k*2], py = wv[o+k*2+1];
        if (py < lo) lo = py;
        if (py > hiY) hiY = py;
        if (px < loX) loX = px;
        if (px > hiX) hiX = px;
      }
    }
    const speeds = [];
    for (let i=0;i<live;i++) speeds.push(Math.hypot(vx[i],vy[i]) + Math.abs(va[i])*bound[i]);
    return { phase, asked, count: N, live, r: SIZE, w: W, h: H, busiest: busy, speeds,
             kinds: [...new Set(TPL.map(t => t.kind))],
             highest: lo, lowest: hiY, leftmost: loX, rightmost: hiX,
             xs: Array.from(bx.subarray(0,live)), ys: Array.from(by.subarray(0,live)) };
  };

  /* count the pixels two pieces both cover, rather than take anyone's word for it:
     draw them all at one unit of red, adding as they go, and see what comes out
     above one */
  window.pit.overlaps = () => {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#000'; g.fillRect(0,0,W,H);   /* opaque, or every softened edge is
                                                    premultiplied and back again into
                                                    something that reads as an overlap */
    /* the outlines as the solver leaves them, with no moat cut between them: what
       is measured here is whether two pieces are in the same place, not whether the
       drawing hides it. Sixty units of red rather than one, because at one the
       premultiply and back again returns every softened edge as two */
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = 'rgb(60,0,0)';
    for (let i=0;i<live;i++){
      g.save(); g.translate(bx[i], by[i]); g.rotate(ba[i]); g.fill(TPL[tpl[i]].path); g.restore();
    }
    const d = g.getImageData(0,0,W,H).data;
    let over = 0, ink = 0;
    for (let k=0;k<d.length;k+=4){ if (d[k] > 90) over++; else if (d[k] > 20) ink++; }
    return { over, ink, skin: TPL[0].skin,
             deps: Array.from(cdep.subarray(0, nc)).sort((a,b) => b-a) };
  };
}

fit();
draw();
requestAnimationFrame(frame);
})();
</script>
